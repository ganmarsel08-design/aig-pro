<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c1226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="АиГДневник">
<meta name="description" content="АиГДневник Pro: истории родов, дневники, партограмма, протоколы операций и эпикризы.">
<title>АиГДневник</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{
  --ink:#2a1a26;--ink2:#5d4a57;--mute:#8a7884;--bg:#f8f3ee;--card:#fff;--line:#eaded6;
  --brand:#5a1f45;--brand2:#7b2f5f;--rose:#c8577a;--rose-l:#fbe9ef;--sand:#f3e6d8;
  --red:#b8322a;--red-l:#fdebe8;--amber:#a76a00;--amber-l:#fff4dc;--green:#2f7d4f;--green-l:#e6f4ea;--blue:#285f8f;--blue-l:#e7f0f8;
  --r:14px;--sh:0 1px 2px rgba(60,20,45,.06),0 4px 14px rgba(60,20,45,.05);
  font-size:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--brand2)}
button{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;margin:0}
h2{font-size:1.05rem;margin:22px 4px 8px;color:var(--brand);letter-spacing:.01em}
h3{font-size:.98rem;margin:14px 0 6px}
p{margin:.4em 0}
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(40,10,30,.25)}
.top .ttl{font-weight:650;font-size:1.06rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;font-weight:400;opacity:.75;font-size:.76rem}
.top a,.top button.ic{color:#fff;text-decoration:none;background:rgba(255,255,255,.12);border:0;border-radius:10px;min-width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:12px 12px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:var(--sh)}
.card.tight{padding:10px 12px}
.meta{color:var(--mute);font-size:.86rem}
.src{color:var(--mute);font-size:.78rem;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.pill{border-radius:10px;padding:9px 12px;margin:8px 0;font-size:.92rem}
.pill.info{background:var(--blue-l);color:#183f61}
.pill.warn{background:var(--amber-l);color:#6b4600}
.pill.bad{background:var(--red-l);color:#7c1d16}
.pill.ok{background:var(--green-l);color:#1d5534}
.pill.rose{background:var(--rose-l);color:#6d1f3d}
/* плитки */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px 11px;box-shadow:var(--sh);position:relative;min-height:84px}
.tile b{display:block;font-size:.98rem;margin-bottom:3px;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.tile span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--mute);font-size:.8rem;line-height:1.3}
.tile.urg{border-left:4px solid var(--red)}
.tile.calc{border-left:4px solid var(--rose)}
.tile.doc{border-left:4px solid var(--brand2)}
.tile.blue{border-left:4px solid var(--blue)}
.tile .em{position:absolute;right:10px;top:10px;font-size:1.15rem;opacity:.85}
.hero{background:linear-gradient(135deg,var(--brand) 0%,#8a3a63 100%);color:#fff;border-radius:18px;padding:18px 16px;margin:6px 0 14px;box-shadow:var(--sh)}
.hero h1{font-size:1.35rem;margin-bottom:4px}
.hero p{opacity:.88;font-size:.92rem;margin:0}
/* формы */
.form{display:flex;flex-wrap:wrap;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;flex:1 1 140px;min-width:0}
.f.wide{flex-basis:100%}
.f:has(select){flex:1 1 230px}
.f>span:first-child{font-size:.8rem;color:var(--ink2)}
.inp{display:flex;align-items:center;background:#fff;border:1px solid #dccbc1;border-radius:10px;padding:0 10px;min-height:44px}
.inp:focus-within{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(123,47,95,.12)}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;padding:9px 0;color:var(--ink)}
.inp select{appearance:none;-webkit-appearance:none}
.inp i{font-style:normal;color:var(--mute);font-size:.82rem;padding-left:6px;white-space:nowrap}
textarea.big{width:100%;min-height:220px;border:1px solid #dccbc1;border-radius:10px;padding:10px;font:15px/1.5 inherit;font-family:inherit;resize:vertical;background:#fff}
.segm{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.segm button{border:1px solid #dccbc1;background:#fff;border-radius:999px;padding:7px 12px;font-size:.88rem;cursor:pointer}
.segm button.on{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #dccbc1;background:#fff;border-radius:999px;padding:6px 11px;font-size:.86rem;cursor:pointer;user-select:none}
.chip.on{background:var(--rose-l);border-color:var(--rose);color:#6d1f3d}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:11px 16px;background:var(--brand2);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;font-size:.95rem}
.btn.ghost{background:#fff;color:var(--brand2);border:1px solid #d9c3cf}
.btn.red{background:var(--red)}
.btn.sm{padding:7px 11px;font-size:.85rem;border-radius:9px}
.btn:disabled{opacity:.45}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
/* результаты */
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.res>div{background:var(--sand);border-radius:11px;padding:9px 11px}
.res>div b{display:block;font-size:1.25rem;color:var(--brand);font-variant-numeric:tabular-nums}
.res>div span{font-size:.78rem;color:var(--ink2)}
.res>div.hl{background:var(--rose-l)}
.res>div.bad{background:var(--red-l)}.res>div.bad b{color:var(--red)}
.res>div.ok{background:var(--green-l)}.res>div.ok b{color:var(--green)}
table.t{border-collapse:collapse;width:100%;font-size:.86rem;margin:8px 0}
table.t th,table.t td{border:1px solid var(--line);padding:6px 7px;vertical-align:top;text-align:left}
table.t th{background:#f6ece6;font-weight:600}
table.t tr.on td{background:var(--rose-l);font-weight:600}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
ul.steps{list-style:none;padding:0;margin:8px 0}
ul.steps li{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--line)}
ul.steps li:last-child{border-bottom:0}
ul.steps input{width:22px;height:22px;flex:0 0 22px;margin-top:1px;accent-color:var(--brand2)}
ul.steps li.done span{color:var(--mute);text-decoration:line-through}
ul.steps li em{display:block;font-style:normal;color:var(--mute);font-size:.82rem;text-decoration:none}
ul.steps .tm{margin-left:auto;font-size:.78rem;color:var(--green);white-space:nowrap;font-variant-numeric:tabular-nums}
.clock{position:sticky;top:58px;z-index:10;display:flex;align-items:center;gap:10px;background:var(--red);color:#fff;border-radius:14px;padding:10px 14px;margin:8px 0;box-shadow:var(--sh)}
.clock b{font-size:1.7rem;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock span{flex:1;font-size:.85rem;opacity:.9}
.clock button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:9px;padding:8px 11px;cursor:pointer}
.clock.idle{background:var(--brand)}
.log{font-size:.85rem;background:#fbf7f3;border-radius:10px;padding:8px 10px;max-height:260px;overflow:auto;white-space:pre-wrap;font-variant-numeric:tabular-nums}
.search{position:relative}
.search input{width:100%;border:1px solid #dccbc1;border-radius:12px;padding:12px 14px;font:inherit;background:#fff}
.list a.row{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.list a.row:last-child{border-bottom:0}
.list a.row span{flex:1;min-width:0}
.list a.row small{display:block;color:var(--mute);font-size:.78rem}
.list a.row em{font-style:normal;color:var(--mute);font-size:.8rem;white-space:nowrap}
.list .gh{font-size:.78rem;font-weight:700;color:var(--brand2);text-transform:uppercase;letter-spacing:.04em;padding:12px 12px 4px}
/* протокол */
.proto h3{color:var(--brand);margin:16px 0 6px;font-size:.98rem}
.proto p{margin:.35em 0;text-align:left}
.proto ul{margin:.3em 0;padding-left:1.2em}
.proto li{margin:.15em 0}
.proto mark{background:#ffe680;padding:0 2px;border-radius:3px}
.toc a{display:block;padding:5px 0;font-size:.88rem;text-decoration:none;border-bottom:1px dotted var(--line)}
details.card>summary{cursor:pointer;font-weight:600;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary:after{content:'▾';float:right;color:var(--mute)}
details.card[open]>summary:after{content:'▴'}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}
.kv b{font-weight:600;color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);background:#2a1a26;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:100;font-size:.9rem;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{color:var(--mute);font-size:.78rem;text-align:center;margin:26px 8px 10px;line-height:1.5}
.badge{display:inline-block;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--rose-l);color:#6d1f3d;vertical-align:middle}
.badge.g{background:var(--green-l);color:#1d5534}.badge.r{background:var(--red-l);color:#7c1d16}.badge.a{background:var(--amber-l);color:#6b4600}
.paper{white-space:pre-wrap;font:15px/1.55 "Times New Roman",Georgia,serif;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;color:#111}
.chk{display:flex;gap:9px;align-items:flex-start;padding:7px 2px;cursor:pointer}
.chk input{width:20px;height:20px;flex:0 0 20px;accent-color:var(--brand2);margin-top:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}.res{grid-template-columns:1fr 1fr}}
@media print{.top,.actions,.btn,.clock{display:none!important}body{background:#fff}.card{box-shadow:none;border:0}}
/* АиГДневник Pro — тёмная шапка, золотой акцент */
:root{--brand:#3a1734;--brand2:#7a3166;--gold:#c99a45;--gold-l:#f7ecd7}
.top{background:linear-gradient(180deg,#3a1734,#2c1226)}
.hero{background:linear-gradient(135deg,#2c1226 0%,#5a2350 100%)}
.hero h1:after{content:' Pro';color:var(--gold);font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:4px -12px 8px;padding:0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.88rem;white-space:nowrap}
.tabs a.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pcard{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.pcard:last-child{border-bottom:0}
.pcard .lb{font-weight:650}
.pcard .sub{color:var(--mute);font-size:.82rem}
.pcard .bd{margin-left:auto;text-align:right;font-size:.8rem;color:var(--ink2);white-space:nowrap}
.pcard .bd b{display:block;font-size:1rem;color:var(--brand2)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;border-radius:999px;padding:14px 20px;box-shadow:0 6px 18px rgba(40,10,30,.3);background:var(--gold);color:#2c1226}
.sec{border-top:1px dashed var(--line);margin-top:12px;padding-top:6px}
.sec>h3{color:var(--brand2)}
.drow{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.drow:last-child{border-bottom:0}
.drow span{flex:1}
.drow small{color:var(--mute);display:block;font-size:.8rem}
.alert{color:var(--red);font-size:.82rem}
svg.parto{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
.edited{font-size:.78rem;color:var(--amber);margin:6px 0}
.badge.gold{background:var(--gold-l);color:#6a4a10}

.printwrap h2{font-size:1.1rem}
@media print{.noprint,.tabs,.fab{display:none!important}main{max-width:none;padding:0}.printwrap table{font-size:9px}svg.parto{max-height:260px}}
</style>

<div id="app"></div>
<noscript><div style="max-width:620px;margin:40px auto;padding:0 20px;font:16px/1.5 system-ui,sans-serif">
<h1 style="font-size:22px">Откройте в браузере</h1><p>Страница открыта в режиме просмотра, где скрипты отключены. Откройте ссылку в Safari или Chrome.</p></div></noscript>

<script>
const VERSION = '202611121751';
/* Общие функции АиГПомощника и АиГДневника Pro */
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v) => { if (v == null) return null; const t = parseFloat(String(v).replace(',', '.').replace(/\s/g, '')); return isFinite(t) ? t : null; };
const fmt = (v, d = 1) => {
  if (v == null || !isFinite(v)) return '—';
  const r = Math.round(v * Math.pow(10, d)) / Math.pow(10, d);
  return String(r).replace('.', ',');
};
const fmt0 = (v) => fmt(v, 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad2 = (n) => String(n).padStart(2, '0');

/* ---------- хранилище ---------- */
function makeStore(prefix) {
  const mem = {};
  return {
    get(k, def = null) {
      try { const v = localStorage.getItem(prefix + k); if (v !== null) return JSON.parse(v); } catch (e) {}
      return k in mem ? mem[k] : def;
    },
    set(k, v) { mem[k] = v; try { localStorage.setItem(prefix + k, JSON.stringify(v)); } catch (e) {} },
    del(k) { delete mem[k]; try { localStorage.removeItem(prefix + k); } catch (e) {} },
    raw(k) { try { return localStorage.getItem(prefix + k); } catch (e) { return null; } },
    setRaw(k, v) { try { localStorage.setItem(prefix + k, v); } catch (e) {} },
  };
}

/* ---------- даты и срок беременности ---------- */
const DAY = 86400000;
const toDate = (s) => { if (!s) return null; const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); if (!m) return null; return new Date(+m[1], +m[2] - 1, +m[3]); };
const isoDate = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const today = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const ruDate = (d) => d ? pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear() : '—';
const ruDateS = (s) => ruDate(toDate(s));
const ruTime = (d) => pad2(d.getHours()) + ':' + pad2(d.getMinutes());
const daysBetween = (a, b) => Math.round((b - a) / DAY);
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const gaText = (days) => {
  if (days == null || !isFinite(days)) return '—';
  const w = Math.floor(days / 7), d = days - w * 7;
  return d ? `${w} нед ${d} дн` : `${w} нед`;
};
const gaShort = (days) => { if (days == null) return '—'; const w = Math.floor(days / 7), d = days - w * 7; return `${w}+${d}`; };
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return a; if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return b; return c; };

/* ---------- UI ---------- */
function toast(msg, ms = 2600) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Скопировано'); return; } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('Скопировано'); } catch (e) { toast('Не удалось скопировать'); }
  ta.remove();
}
const field = (id, label, unit = '', val = '', ph = '', extra = '') =>
  `<label class="f"><span>${label}</span><span class="inp"><input id="${id}" inputmode="decimal" value="${esc(val)}" placeholder="${esc(ph)}" ${extra}><i>${unit}</i></span></label>`;
const tfield = (id, label, val = '', ph = '', extra = '') =>
  `<label class="f wide"><span>${label}</span><span class="inp"><input id="${id}" value="${esc(val)}" placeholder="${esc(ph)}" ${extra}><i></i></span></label>`;
const dfield = (id, label, val = '', type = 'date') =>
  `<label class="f"><span>${label}</span><span class="inp"><input id="${id}" type="${type}" value="${esc(val)}"><i></i></span></label>`;
const sel = (id, label, opts, val, wide = false) =>
  `<label class="f${wide ? ' wide' : ''}"><span>${label}</span><span class="inp"><select id="${id}">${opts.map((o) => { const [v, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(t)}</option>`; }).join('')}</select><i></i></span></label>`;
const seg = (name, opts, val) => `<div class="segm" data-seg="${name}">${opts.map(([v, t]) => `<button type="button" data-v="${esc(v)}" class="${String(v) === String(val) ? 'on' : ''}">${esc(t)}</button>`).join('')}</div>`;
const pill = (t, cls = 'info') => `<p class="pill ${cls}">${t}</p>`;
const src = (t) => `<p class="src">${t}</p>`;

function bindSeg(root, name, cb) {
  const el = $(`[data-seg="${name}"]`, root);
  if (!el) return;
  el.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    $$('button', el).forEach((x) => x.classList.toggle('on', x === b));
    cb(b.dataset.v);
  });
}
const segVal = (root, name) => { const b = $(`[data-seg="${name}"] button.on`, root); return b ? b.dataset.v : null; };

/* ---------- таймер для неотложных алгоритмов ---------- */
function makeClock(onTick) {
  let start = null, id = 0;
  return {
    start(t = Date.now()) { start = t; clearInterval(id); id = setInterval(() => onTick(this.elapsed()), 1000); onTick(0); },
    stop() { clearInterval(id); start = null; },
    elapsed() { return start ? Math.floor((Date.now() - start) / 1000) : 0; },
    running() { return !!start; },
    since() { return start; },
  };
}
const mmss = (s) => `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}`;

/* ---------- простой генератор .docx (без библиотек) ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(buf) { let c = 0xffffffff; for (let i = 0; i < buf.length; i++) c = CRC_T[(c ^ buf[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
function zipStore(files) {
  const enc = new TextEncoder(); const parts = []; const central = []; let off = 0;
  for (const [name, content] of files) {

  if (p.exam) k.push('exam', 'obos');
  if ((p.parto && (p.parto.e || []).length)) k.push('parto');
  if (p.birth && p.birth.tBirth) k.push('birth');
  if (p.cs && hasData(p.cs)) k.push('cs');
  (p.cons || []).forEach((_, i) => k.push('cons' + i));
  if (p.wcl && Object.keys(p.wcl).length) k.push('wcl');
  return k;
}
function historyText(p) {
  const t = team();
  const head = [];
  if (t.org) head.push(`# ${t.org}`);
  head.push(`# ИСТОРИЯ ${p.cat === 'gyn' ? 'БОЛЕЗНИ' : 'РОДОВ'}${p.label ? ' — ' + p.label : ''}`);
  head.push(`Дата поступления: ${ruDateS(p.adm)}${p.admT ? ' ' + p.admT : ''}. Отделение: ${t.dept || '__'}.`);
  const parts = [head.join('\n')];
  for (const k of docKeys(p)) { const s = docText(p, k); if (s) parts.push(s); }
  const dd = (p.diaries || []).slice().sort((a, b) => (a.date + (a.time || '') < b.date + (b.time || '') ? -1 : 1));
  if (dd.length) parts.push('# ДНЕВНИКИ\n' + dd.map((d) => docText(p, 'dy' + d.id)).join('\n\n'));
  if (p.out && p.out.kind) parts.push(docText(p, p.out.kind));
  if (parts.length > 1) parts.splice(0, 2, parts[0] + '\n\n' + parts[1]);
  return parts.join('\f');
}

/* АиГДневник Pro — доклад, отчёт, напоминания, чек-лист ВОЗ, согласия, печать партограммы */

/* ---------- напоминания ---------- */
function remindersOf(p) {
  const R = [], c = p.card || {}, now = Date.now(), H = 3600000;
  if (p.closed) return R;
  const born = birthAt(p);
  // профилактика РДС
  if (c.sterT && c.sterDrug && c.sterDrug !== 'нет' && !born) {
    const n = c.sterDrug === 'бетаметазон' ? 2 : 4, gap = c.sterDrug === 'бетаметазон' ? 24 : 12;
    const t0 = new Date(c.sterT).getTime();
    for (let i = 1; i < n; i++) {
      const due = t0 + i * gap * H;
      if (due > now - 2 * H && due - now < 3 * H) { R.push([due < now ? 'bad' : 'warn', `${i + 1}-я доза ${c.sterDrug === 'бетаметазон' ? 'бетаметазона 12 мг' : 'дексаметазона 6 мг'} — ${due < now ? 'просрочена с' : 'в'} ${ruTime(new Date(due))}`]); break; }
    }
  }
  // магний
  if (c.mgT && !c.mgStop) {
    const h = (now - new Date(c.mgT)) / H;
    const bornH = born ? (now - new Date(born)) / H : null;
    if (h >= 24 && (bornH == null || bornH >= 24)) R.push(['warn', `Магний вводится ${fmt0(h)} ч — оцените отмену (≥24 ч${born ? ' после родов' : ''})`]);
    else R.push(['info', `Магний идёт ${fmt0(h)} ч: коленный рефлекс, ЧД, диурез`]);
  }
  // анти-D
  if (/−|-/.test(c.rh || '') && born && !c.antiD) {
    const h = (now - new Date(born)) / H;
    if (h <= 72) R.push([h > 48 ? 'bad' : 'warn', `Rh(−): анти-D иммуноглобулин до ${ruDate(new Date(new Date(born).getTime() + 72 * H))} ${ruTime(new Date(new Date(born).getTime() + 72 * H))}, если ребёнок Rh(+)`]);
  }
  // безводный период до родов
  const rom = (p.birth && p.birth.tRom) || (p.exam && p.exam.romT);
  if (rom && !born) { const h = (now - new Date(rom)) / H; if (h >= 18) R.push(['bad', `Безводный период ${fmt0(h)} ч (≥18 ч) — антибиотикопрофилактика, сообщить неонатологу`]); else if (h >= 12) R.push(['warn', `Безводный период ${fmt0(h)} ч`]); }
  // партограмма
  if (p.cat === 'labor' && p.parto && (p.parto.e || []).length && !born) {
    const last = Math.max(...p.parto.e.map((e) => new Date(e.t).getTime()));
    const m = (now - last) / 60000;
    if (m > 60) R.push(['warn', `Партограмма: последняя запись ${fmt0(m)} мин назад`]);
    const al = partoRows(p).slice(-1)[0];
    if (al && al.alerts.length) R.push(['bad', 'Партограмма: ' + al.alerts.join('; ')]);
  }
  // дневник
  const td = isoDate(today());
  if (p.cat !== 'labor' && !(p.diaries || []).some((d) => d.date === td) && toDate(p.adm) < today()) R.push(['info', 'Нет дневника за сегодня']);
  // выписка
  const day = ppDay(p);
  if (day != null && ((!isCS(p) && day >= 3) || (isCS(p) && day >= 5)) && !(p.out && p.out.kind)) R.push(['info', `${uc1(sut(day))} — готовить выписку?`]);
  // чек-лист ВОЗ
  const w = p.wcl || {};
  if (p.cat === 'labor' && !(w.p1 && w.p1.t)) R.push(['info', 'Чек-лист ВОЗ: пауза 1 (при поступлении) не отмечена']);
  if (born && !(w.p3 && w.p3.t) && (now - new Date(born)) / H < 24) R.push(['info', 'Чек-лист ВОЗ: пауза 3 (в течение часа после родов) не отмечена']);
  return R;
}
const remBlock = (p) => { const r = remindersOf(p); return r.length ? `<div class="card tight">${r.map(([c, t]) => `<p class="pill ${c}" style="margin:4px 0">${esc(t)}</p>`).join('')}</div>` : ''; };

/* ---------- Робсон по данным карты ---------- */
function robsonOfPt(p) {
  const c = p.card || {}, d = p.dx || {};
  const born = birthAt(p); if (!born) return null;
  const ga = gaOn(p, new Date(born));
  const cs = isCS(p);
  const s = {
    par: +c.P > 0 ? '1' : '0', cs: +c.cs > 0 ? '1' : '0',
    mul: (d.list || []).includes('Многоплодная беременность') ? '2' : '1',
    pres: /тазов|ножн/.test(d.pres || (p.exam || {}).pres || '') ? 'b' : /попер|кос/.test(d.pres || (p.exam || {}).lie || '') ? 't' : 'c',
    term: ga != null && ga < 259 ? 'p' : 't',
    on: cs && !(p.birth && p.birth.tOnset) && !(p.exam && p.exam.ctxT) && !(p.parto && (p.parto.e || []).length) ? 'c' : (p.birth && p.birth.induced) ? 'i' : 's',
  };
  if (s.mul === '2') return 8; if (s.pres === 't') return 9; if (s.pres === 'b') return s.par === '0' ? 6 : 7;
  if (s.term === 'p') return 10; if (s.par === '0') return s.on === 's' ? 1 : 2; if (s.cs === '1') return 5; return s.on === 's' ? 3 : 4;
}

function handoverText() {
  const t = team(); const act = DB.all().filter((p) => !p.closed);
  const order = ['labor', 'preg', 'post', 'cs', 'gyn'];
  const L = [`# УТРЕННИЙ ДОКЛАД ${ruDate(new Date())}`];

  for (const cat of order) {

    L.push(`## ${CAT[cat]} — ${a.length}`);

      const last = (p.diaries || []).slice().sort((x, y) => (x.date + (x.time || '') < y.date + (y.time || '') ? 1 : -1))[0];
      const pe = p.parto && (p.parto.e || []).length ? partoRows(p).slice(-1)[0] : null;
      const s = [`${i + 1}. ${p.label}${p.card && p.card.age ? ', ' + yrs(p.card.age) : ''}. ${diagText(p)}`];
      if (pe) s.push(`Последняя запись в родах ${ruTime(new Date(pe.t))}: раскрытие ${pe.dil || '__'} см, ЧСС плода ${pe.fhr || '__'}, АД ${pe.sbp || '__'}/${pe.dbp || '__'}.`);

  return L.join('\n');
}

/* ---------- отчёт за месяц ---------- */
function monthStats(ym) {
  const all = DB.all().filter((p) => { const b = birthAt(p); return b && b.slice(0, 7) === ym; });
  const S = { n: all.length, vag: 0, cs: 0, pre: 0, prk: 0, loss: [], low5: 0, lbw: 0, macro: 0, tear1: 0, tear2: 0, epis: 0, cx: 0, rob: {}, robCs: {}, ind: 0, csCat: {} };
  for (const p of all) {
    const cs = isCS(p), b = p.birth || {}, o = p.cs || {};
    const ga = gaOn(p, new Date(birthAt(p)));
    cs ? S.cs++ : S.vag++;
    if (ga != null && ga < 259) S.pre++;
    const loss = num(cs ? o.loss : b.loss); if (loss != null) { S.loss.push(loss); if (loss >= (cs ? 1000 : 500)) S.prk++; }
    const ap5 = num(cs ? o.ap5 : b.ap5); if (ap5 != null && ap5 < 7) S.low5++;
    const bw = num(cs ? o.bw : b.bw); if (bw != null) { if (bw < 2500) S.lbw++; if (bw >= 4000) S.macro++; }
    const t = b.tears || ''; if (/промежности I /.test(t + ' ')) S.tear1++; if (/II степени/.test(t) && /промежн/.test(t)) S.tear2++; if (/эпизио/.test(t)) S.epis++; if (/шейки/.test(t)) S.cx++;
    if (b.induced) S.ind++;
    const g = robsonOfPt(p); if (g) { S.rob[g] = (S.rob[g] || 0) + 1; if (cs) S.robCs[g] = (S.robCs[g] || 0) + 1; }
    if (cs && o.cat) { const k = o.cat[0]; S.csCat[k] = (S.csCat[k] || 0) + 1; }
  }
  return S;
}
function reportText(ym) {
  const S = monthStats(ym); const pc = (a, b) => (b ? fmt(a / b * 100, 1) + '%' : '—');
  const [y, m] = ym.split('-');
  const mon = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'][+m - 1];
  const L = [`# ОТЧЁТ ОТДЕЛЕНИЯ ЗА ${mon.toUpperCase()} ${y}`, `Данные из АиГДневника Pro: только пациентки, внесённые в приложение.`];
  L.push(`Родов всего: ${S.n}. Через естественные пути: ${S.vag}. Кесарево сечение: ${S.cs} (${pc(S.cs, S.n)}).`);
  L.push(`Преждевременные роды: ${S.pre} (${pc(S.pre, S.n)}). Индуцированные роды: ${S.ind}.`);
  const mean = S.loss.length ? S.loss.reduce((a, b) => a + b, 0) / S.loss.length : null;
  L.push(`ПРК (≥500 мл после вагинальных, ≥1000 мл при КС): ${S.prk} (${pc(S.prk, S.n)}). Средняя кровопотеря: ${mean != null ? fmt0(mean) + ' мл' : '—'}.`);
  L.push(`Разрывы промежности I ст.: ${S.tear1}, II ст.: ${S.tear2}; эпизиотомия: ${S.epis}; разрывы шейки: ${S.cx}.`);
  L.push(`Новорождённые: масса <2500 г — ${S.lbw}, ≥4000 г — ${S.macro}; Апгар на 5-й минуте <7 — ${S.low5}.`);
  if (Object.keys(S.csCat).length) L.push(`КС по категориям срочности: ${Object.entries(S.csCat).sort().map(([k, v]) => `${k} — ${v}`).join(', ')}.`);
  L.push('## Классификация Робсона');
  for (let g = 1; g <= 10; g++) { const n = S.rob[g] || 0, c = S.robCs[g] || 0; if (n) L.push(`Группа ${g}: ${n} (${pc(n, S.n)} всех родов), КС ${c} (${pc(c, n)} в группе, вклад ${pc(c, S.n)}).`); }
  L.push(''); L.push(sign());
  return { text: L.join('\n'), S };
}

  ['uleu', 'ОАМ', 'лейк. в моче', 'в п/зр', 'лейкоцит\\S*\\s*(?:в\\s*моче|мочи|в\\s*п\\/зр)', 0, 5],

function parseLabs(text, ga) {
  const src = ' ' + String(text).replace(/ /g, ' ').replace(/[×x]\s*10\s*[\^]?\s*\d+\s*\/\s*л/gi, ' ') + ' ';
  const out = [];
  const used = new Set();
  // сначала длинные псевдонимы (моча, общий билирубин), чтобы «лейкоциты в моче» не ушли в ОАК
  const order = LABS.slice().sort((a, b) => (b[1] === 'ОАМ' ? 1 : 0) - (a[1] === 'ОАМ' ? 1 : 0));
  let rest = src;
  for (const [k, grp, name, unit, alias, lo0, hi, norm] of order) {
    const re = new RegExp('(?:^|[\\s,;:(])(?:' + alias + ')\\s*[:=\\-–]?\\s*([<>]?\\s*\\d+(?:[.,]\\d+)?)', 'i');
    const m = re.exec(rest);
    if (!m || used.has(k)) continue;
    let v = parseFloat(m[1].replace(/[<>\s]/g, '').replace(',', '.'));
    if (!isFinite(v)) continue;
    if (norm) v = norm(v);
    let lo = lo0;
    if (k === 'hb' && ga != null) lo = ga >= 98 && ga < 196 ? 105 : 110;
    const flag = v < lo ? '↓' : v > hi ? '↑' : '';
    out.push({ k, grp, name, unit, v, flag, lo, hi });
    used.add(k);
    rest = rest.slice(0, m.index) + ' '.repeat(m[0].length) + rest.slice(m.index + m[0].length);
  }
  out.sort((a, b) => LABS.findIndex((x) => x[0] === a.k) - LABS.findIndex((x) => x[0] === b.k));
  const warn = [];
  const g = (k) => (out.find((x) => x.k === k) || {}).v;
  if (g('hb') != null && g('hb') < 70) warn.push('Hb <70 г/л — тяжёлая анемия; при остром кровотечении ЭМ показана при Hb <80 г/л');
  if (g('plt') != null && g('plt') < 100) warn.push('Тромбоциты <100 — исключить HELLP, ДВС' + (g('plt') <= 50 ? '; ≤50 — тромбоконцентрат при кровотечении и перед операцией' : ''));
  if ((g('alt') || 0) >= 70 || (g('ast') || 0) >= 70) warn.push('АЛТ/АСТ ≥70 — при гипертензии оцените HELLP и тяжесть ПЭ');
  if ((g('ldh') || 0) >= 600) warn.push('ЛДГ ≥600 — признак гемолиза (HELLP)');
  if ((g('cre') || 0) >= 90) warn.push('Креатинин ≥90 мкмоль/л — острое повреждение почек, критерий тяжёлой ПЭ');
  if (g('fib') != null && g('fib') < 2) warn.push('Фибриноген <2 г/л — при кровотечении КРИО или концентрат фибриногена');
  if ((g('uprot') || 0) >= 0.3) warn.push('Протеинурия ≥0,3 г/л — при АГ после 20 нед думать о преэклампсии');
  if (g('glu') != null && g('glu') >= 5.1 && g('glu') <= 7.0) warn.push('Глюкоза натощак 5,1–7,0 — критерий ГСД (если натощак)');
  if ((g('glu') || 0) > 7.0) warn.push('Глюкоза >7,0 натощак — манифестный диабет');
  if (g('fer') != null && g('fer') < 30) warn.push('Ферритин <30 — дефицит железа');
  return { out, warn };
}
const labsLine = (r) => {
  const by = {}; r.out.forEach((x) => { (by[x.grp] = by[x.grp] || []).push(`${x.name} ${fmt(x.v, x.v < 10 ? 2 : x.v < 100 ? 1 : 0)}${x.unit ? ' ' + x.unit : ''}${x.flag}`); });

}

const SKIP = '.paper,.proto,textarea,.log,.chip,option,[data-noi18n],.pill,.meta,.foot,.src,.res>div b,table';
function trText(s) {
  const m = /^(\s*)([\s\S]*?)(\s*)$/.exec(s); const x = m[2].replace(/\s+/g, ' ');
  let t = KK[x];
  if (t === undefined) { const nums = x.match(/\d+(?:[.,:]\d+)*/g); if (nums) { const w = KK_WILD.get(x.replace(/\d+(?:[.,:]\d+)*/g, '#')); if (w) { let i = 0; t = w.replace(/#/g, () => nums[i++] || '#'); } } }
  return t === undefined ? null : m[1] + t + m[3];
}
function trNode(root) {
  if (LANG.get() !== 'kk' || !root) return;
  const walk = (n) => {
    if (n.nodeType === 3) { if (/[А-Яа-яЁё]/.test(n.data)) { const p = n.parentElement; if (p && !p.closest(SKIP)) { const t = trText(n.data); if (t !== null && t !== n.data) n.data = t; } } return; }
    if (n.nodeType !== 1 || n.matches(SKIP)) return;
    for (const c of n.childNodes) walk(c);
  };
  walk(root);
}

    S: (k, label, opts, wide = true) => `<label class="f${wide ? ' wide' : ''}"><span>${label}</span><span class="inp"><select data-k="${k}">${opts.map((o) => { const [val, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(v(k) || (Array.isArray(opts[0]) ? opts[0][0] : opts[0])) === String(val) ? 'selected' : ''}>${esc(t)}</option>`; }).join('')}</select><i></i></span></label>`,

function bindForm(root, p, onChange) {
  const save = () => { DB.put(p); onChange && onChange(); };
  root.addEventListener('input', (e) => { const k = e.target.dataset.k; if (!k) return; setK(p, k, e.target.type === 'checkbox' ? e.target.checked : e.target.value); clearTimeout(bindForm._t); bindForm._t = setTimeout(save, 250); });
  root.addEventListener('change', (e) => { const k = e.target.dataset.k; if (!k) return; setK(p, k, e.target.type === 'checkbox' ? e.target.checked : e.target.value); save(); });
  root.addEventListener('click', (e) => {
    const ch = e.target.closest('.chip'); if (!ch) return;
    const box = ch.closest('[data-arr]'); const k = box.dataset.arr;
    const arr = (getK(p, k) || []).slice(); const val = ch.dataset.v; const i = arr.indexOf(val);
    if (i >= 0) arr.splice(i, 1); else arr.push(val);
    setK(p, k, arr); ch.classList.toggle('on', i < 0); save();
  });
}
/* Блок документа: предпросмотр, копирование, Word, правка */
function docBlock(p, key, title) {
  const txt = docText(p, key);
  const edited = !!(p.edits && p.edits[key]);
  return `<div class="card" data-doc="${key}"><b>${esc(title)}</b>${edited ? '<p class="edited">Текст изменён вручную — данные из форм в него больше не подставляются. «Сбросить правки» вернёт автоматический текст.</p>' : ''}
    <div class="paper" data-paper>${txt ? esc(txt.replace(/^#+ /gm, '')) : '<span class="meta">Заполните поля — текст появится здесь.</span>'}</div>
    <textarea class="big" data-edit hidden></textarea>
    <div class="actions"><button class="btn sm" data-act="copy">Скопировать</button><button class="btn sm ghost" data-act="word">Word</button><button class="btn sm ghost" data-act="edit">Править текст</button>${edited ? '<button class="btn sm ghost" data-act="reset">Сбросить правки</button>' : ''}</div></div>`;
}
function bindDocs(root, p, rerender) {
  root.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const card = b.closest('[data-doc]'); const key = card.dataset.doc;
    const t = docText(p, key);
    if (b.dataset.act === 'copy') copyText(t.replace(/^#+ /gm, ''));
    if (b.dataset.act === 'word') download(docxFromText(t), safeName(`${p.label} — ${key}`) + '.docx');
    if (b.dataset.act === 'edit') {
      const ta = $('[data-edit]', card), pa = $('[data-paper]', card);
      if (ta.hidden) { ta.value = t; ta.hidden = false; pa.hidden = true; b.textContent = 'Готово'; ta.focus(); }
      else { p.edits = p.edits || {}; if (ta.value.trim() && ta.value !== docGen(p, key)) p.edits[key] = ta.value; DB.put(p); rerender(); }
    }
    if (b.dataset.act === 'reset') { if (p.edits) delete p.edits[key]; DB.put(p); rerender(); }
  });
}
const refreshDocs = (root, p) => $$('[data-doc]', root).forEach((c) => { if (p.edits && p.edits[c.dataset.doc]) return; const t = docGen(p, c.dataset.doc); const pa = $('[data-paper]', c); if (pa && !pa.hidden) pa.innerHTML = t ? esc(t.replace(/^#+ /gm, '')) : '<span class="meta">Заполните поля — текст появится здесь.</span>'; });

/* ---------- партограмма ---------- */
function partoSVG(p) {
  const P = p.parto || {}; const rows = partoRows(p);
  if (!P.start && !rows.length) return '';
  const t0 = new Date([P.start].concat(rows.map((e) => e.t)).filter(Boolean).sort()[0]); const W = 420, H = 300, L = 28, R = 8, T = 12, B = 44;
  const hours = Math.max(10, Math.ceil(Math.max(0, ...rows.map((e) => (new Date(e.t) - t0) / 3600000))) + 1);
  const x = (h) => L + (W - L - R) * h / hours, y = (v) => T + (H - T - B) * (10 - v) / 10;
  let s = `<svg class="parto" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-size="12" font-family="system-ui">`;
  for (let v = 0; v <= 10; v++) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 5 ? '#c99a45' : '#eee'}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" fill="#8a7884">${v}</text>`;
  for (let h = 0; h <= hours; h++) s += `<line x1="${x(h)}" x2="${x(h)}" y1="${T}" y2="${H - B}" stroke="#f1e7e1"/><text x="${x(h)}" y="${H - B + 14}" text-anchor="middle" fill="#8a7884">${h}</text>`;
  s += `<text x="${(W + L) / 2}" y="${H - 18}" text-anchor="middle" fill="#5d4a57">часы от начала активной фазы</text><text x="${(W + L) / 2}" y="${H - 4}" text-anchor="middle" fill="#8a7884" font-size="10">× раскрытие, см · ○ головка над входом, пятые · пунктир — пороги ВОЗ</text>`;
  // эталон «пороговое время» по ВОЗ: от 5 см
  let acc = 0, pts = [[0, 5]]; [5, 6, 7, 8, 9].forEach((cm) => { acc += LCG_TIME[cm]; pts.push([acc, cm + 1]); });
  s += `<polyline points="${pts.map(([h, v]) => `${x(h)},${y(v)}`).join(' ')}" fill="none" stroke="#e7a1a1" stroke-dasharray="5 4"/>`;
  const dil = rows.filter((e) => num(e.dil) != null).map((e) => [(new Date(e.t) - t0) / 3600000, num(e.dil), e.alerts.length]);
  if (dil.length > 1) s += `<polyline points="${dil.map(([h, v]) => `${x(h)},${y(v)}`).join(' ')}" fill="none" stroke="#7a3166" stroke-width="2"/>`;
  dil.forEach(([h, v, a]) => { s += `<text x="${x(h)}" y="${y(v) + 5}" text-anchor="middle" font-size="15" font-weight="700" fill="${a ? '#b8322a' : '#7a3166'}">×</text>`; });
  rows.filter((e) => e.desc !== undefined && e.desc !== '').forEach((e) => { const h = (new Date(e.t) - t0) / 3600000; s += `<circle cx="${x(h)}" cy="${y(num(e.desc) * 2)}" r="5" fill="none" stroke="#285f8f" stroke-width="2"/>`; });
  return s + '</svg>';
}

    <div class="sec"><h3>III период</h3><div class="form">${f.W('birth.oxy', 'Утеротоник', '10 ЕД в/м')}${f.S('birth.placHow', 'Послед', ['при контролируемых тракциях за пуповину', 'самостоятельно', 'ручное отделение и выделение последа'], false)}${f.W('birth.plac', 'Осмотр последа', 'цел, оболочки все')}${f.I('birth.placSize', 'Размеры', 'см', '18×16×2')}${f.I('birth.placW', 'Масса', 'г', '', 'num')}${f.I('birth.cordLen', 'Пуповина', 'см', '', 'num')}</div></div>
    <div class="sec"><h3>Родовые пути и кровопотеря</h3><div class="form">${f.S('birth.tears', 'Разрывы', ['разрывов нет', 'разрыв промежности I степени', 'разрыв промежности II степени', 'разрыв шейки матки I степени', 'эпизиотомия', 'разрыв слизистой влагалища'])}${f.W('birth.repair', 'Ушивание', 'ушит под местной анестезией нитью Викрил')}${f.I('birth.loss', 'Кровопотеря', 'мл', '', 'num')}</div></div>` : `
    <div class="form">${f.I('cs.t1', 'Начало операции', '', '', 'datetime-local')}${f.I('cs.t2', 'Окончание', '', '', 'datetime-local')}${f.I('cs.tBirth', 'Извлечение ребёнка', '', '', 'datetime-local')}</div>
    <div class="sec"><h3>Показания</h3>${f.C('cs.ind', ['Рубец на матке', 'Тазовое предлежание', 'Дистресс плода', 'Клинически узкий таз', 'Слабость родовой деятельности, неэффективная стимуляция', 'Тяжёлая преэклампсия', 'ПОНРП', 'Предлежание плаценты', 'Поперечное положение плода', 'Выпадение пуповины', 'Многоплодная беременность', 'Неудачная индукция', 'Разрыв матки'])}<div class="form">${f.W('cs.indX', 'Другое')}${f.S('cs.cat', 'Категория срочности', CSOPT.cat)}</div></div>
    <div class="sec"><h3>Операция</h3><div class="form">${f.S('cs.anes', 'Анестезия', CSOPT.anes)}${f.I('cs.abx', 'Цефазолин', 'г', (num((p.card || {}).w) >= 80 ? '2' : '1'))}${f.S('cs.skin', 'Разрез кожи', CSOPT.skin)}${f.I('cs.len', 'Длина разреза', 'см', '12–14')}${f.S('cs.uter', 'Разрез на матке', CSOPT.uter)}${f.W('cs.adh', 'Спаечный процесс, особенности', '')}
      ${f.S('cs.wcol', 'Воды', ['светлые', 'мекониальные', 'с примесью крови', 'отошли ранее'], false)}${f.S('cs.extr', 'Извлечение', CSOPT.extr, false)}</div></div>
    <div class="sec"><h3>Новорождённый</h3>${child('cs')}</div>
    <div class="sec"><h3>Завершение</h3><div class="form">${f.S('cs.ut', 'Утеротоник', CSOPT.ut, false)}${f.S('cs.plac', 'Послед', CSOPT.plac, false)}${f.W('cs.placDesc', 'Послед', 'цел, оболочки все')}${f.S('cs.suture', 'Шов на матке', CSOPT.suture)}${f.W('cs.adnexa', 'Придатки', 'без особенностей')}${f.W('cs.extra', 'Дополнительно', 'например: стерилизация по желанию пациентки')}${f.S('cs.skinS', 'Кожа', CSOPT.skinS, false)}
      ${f.I('cs.loss', 'Кровопотеря', 'мл', '', 'num')}${f.S('cs.urine', 'Моча по катетеру', ['светлая', 'с примесью крови'], false)}${f.I('cs.urineV', 'Объём мочи', 'мл', '', 'num')}</div></div>
    <div class="sec"><h3>Бригада</h3><div class="form">${f.W('cs.surg', 'Хирург')}${f.W('cs.asst', 'Ассистент')}${f.W('cs.anest', 'Анестезиолог')}${f.W('cs.nurse', 'Операционная сестра')}${f.W('cs.neo', 'Неонатолог')}</div></div>`}
    <div id="bal"></div>${(mode === 'vag' ? p.birth.tBirth : p.cs.tBirth) ? `<div class="actions"><a class="btn" href="#p-${p.id}/qr">Передать ребёнка неонатологу (QR)</a></div>` : ''}</div>
    ${mode === 'vag' ? docBlock(p, 'birth', 'Течение родов') : docBlock(p, 'cs', 'Протокол операции')}`;
  const draw = () => {
    const tB = mode === 'vag' ? p.birth.tBirth : p.cs.tBirth;
    if (tB && (p.cat === 'preg' || p.cat === 'labor')) { p.cat = mode === 'vag' ? 'post' : 'cs'; DB.put(p); toast('Категория: ' + CAT[p.cat]); }
    const w = num((p.card || {}).w), loss = num(mode === 'vag' ? p.birth.loss : p.cs.loss);
    const lim = mode === 'vag' ? 500 : 1000;
    $('#bal').innerHTML = loss != null ? pill(`Кровопотеря ${fmt0(loss)} мл${w ? ` (${fmt(loss / w / 10, 2)}% массы тела)` : ''}${loss >= lim ? ' — послеродовое кровотечение по определению протокола' : ''}.`, loss >= lim ? 'bad' : 'ok') : '';
    refreshDocs(tb, p);
  };
  bindForm($('#bf'), p, draw); bindDocs(tb, p, () => ptPage(p.id, 'birth'));
  bindSeg(tb, 'bmode', (v) => { p.bmode = v; DB.put(p); ptPage(p.id, 'birth'); });
  draw();
}

/* ---------- документы ---------- */
function tabDocs(tb, p) {
  p.cons = p.cons || []; p.out = p.out || {};
  if (!p.out.date) p.out.date = isoDate(today());
  const f = mk(p);
  tb.innerHTML = `<h2>Консилиумы</h2>${p.cons.map((c, i) => `<div class="card" id="cs${i}"><div class="form">${f.S(`cons.${i}.type`, 'Тема', Object.entries(CONS_TYPES).map(([k, v]) => [k, v[0]]))}${f.I(`cons.${i}.t`, 'Дата и время', '', '', 'datetime-local')}${f.W(`cons.${i}.who`, 'Состав', 'зав. отделением __, анестезиолог __, лечащий врач __')}${f.W(`cons.${i}.state`, 'Состояние', 'средней тяжести, АД 150/100')}${f.T(`cons.${i}.why`, 'Обоснование')}${f.T(`cons.${i}.dec`, 'Решение', (CONS_TYPES[c.type] || CONS_TYPES.other)[1])}</div><div class="actions"><button class="btn red sm" data-cdel="${i}">Удалить</button></div></div>${docBlock(p, 'cons' + i, 'Текст консилиума')}`).join('')}
    <div class="actions"><button class="btn ghost" id="cnew">+ Консилиум</button></div>
    <h2>Информированные согласия</h2><div class="card"><p class="meta">Образцы для печати: ФИО и подпись — от руки.</p><div class="actions">${Object.entries(CONSENTS).map(([k, v]) => `<button class="btn sm ghost" data-cons="${k}">${esc(v[0].replace('Согласие на ', ''))}</button>`).join('')}</div></div>
    <h2>Выписка или перевод</h2><div class="card" id="of">${f.S('out.kind', 'Документ', [['', '— выберите'], ['disch', 'Выписной эпикриз'], ['transfer', 'Переводной эпикриз']])}
      <div class="form">${f.I('out.date', 'Дата', '', '', 'date')}${f.W('out.dx', 'Заключительный диагноз', 'оставьте пустым — возьмётся из карты')}${f.W('out.course', 'Течение', 'без осложнений')}${f.T('out.labs', 'Обследования', 'ОАК, ОАМ, биохимия, УЗИ…')}${f.T('out.tx', 'Лечение')}${f.W('out.state', 'Состояние', 'удовлетворительное')}</div>
      ${p.out.kind === 'transfer' ? `<div class="form">${f.W('out.where', 'Куда', 'ОАРИТ / ГКБ №…')}${f.W('out.why', 'Цель перевода')}</div>` : `<div class="form">${f.W('out.home', 'Выписывается', 'домой с ребёнком')}</div><h3>Рекомендации</h3>${f.C('out.rec', OPT.rec)}<div class="form">${f.W('out.recX', 'Ещё')}</div>`}</div>
    ${p.out.kind ? docBlock(p, p.out.kind, p.out.kind === 'transfer' ? 'Переводной эпикриз' : 'Выписной эпикриз') : ''}`;
  $$('[id^="cs"]', tb).forEach((el) => bindForm(el, p, () => refreshDocs(tb, p)));
  bindForm($('#of'), p, () => refreshDocs(tb, p));
  $('select[data-k="out.kind"]', tb).addEventListener('change', () => setTimeout(() => ptPage(p.id, 'docs'), 60));
  $$('select[data-k$=".type"]', tb).forEach((s) => s.addEventListener('change', () => setTimeout(() => ptPage(p.id, 'docs'), 60)));
  bindDocs(tb, p, () => ptPage(p.id, 'docs'));
  $$('[data-cons]', tb).forEach((b) => b.onclick = () => download(docxFromText(consentText(p, b.dataset.cons)), safeName(CONSENTS[b.dataset.cons][0] + ' — ' + p.label) + '.docx'));
  $('#cnew').onclick = () => { p.cons.push({ type: 'mode', t: nowLocal() }); DB.put(p); ptPage(p.id, 'docs'); };
  $$('[data-cdel]', tb).forEach((b) => b.onclick = () => { if (!confirm('Удалить консилиум?')) return; p.cons.splice(+b.dataset.cdel, 1); if (p.edits) Object.keys(p.edits).filter((k) => k.startsWith('cons')).forEach((k) => delete p.edits[k]); DB.put(p); ptPage(p.id, 'docs'); });
}

function tabHist(tb, p) {
  const t = historyText(p);
  tb.innerHTML = `<div class="actions" style="margin-top:0"><button class="btn" id="hw">Вся история в Word</button><button class="btn ghost" id="hc">Скопировать всё</button></div>
    <div class="paper" style="margin-top:10px">${esc(t.replace(/\f/g, '\n\n────────\n\n').replace(/^#+ /gm, ''))}</div>`;
  $('#hw').onclick = () => download(docxFromText(t), safeName(p.label + ' — история') + '.docx');
  $('#hc').onclick = () => copyText(t.replace(/\f/g, '\n\n').replace(/^#+ /gm, ''));
}

/* ---------- настройки ---------- */
function settingsPage() {
  const t = team();
  const f = (k, label, ph) => `<label class="f wide"><span>${label}</span><span class="inp"><input data-t="${k}" value="${esc(t[k] || '')}" placeholder="${esc(ph)}"><i></i></span></label>`;
  page('Настройки', '', `<h2>Шапка и подпись</h2><div class="card form">${f('org', 'Медицинская организация', 'КГП на ПХВ «Жамбылский областной перинатальный центр»')}${f('dept', 'Отделение', 'родильное отделение')}${f('me', 'Врач (подпись в документах)', 'Фамилия И.О.')}${f('chief', 'Заведующий отделением', 'Фамилия И.О.')}</div>
    <h2>Тіл / Язык</h2><div class="card"><p class="meta" data-noi18n>Кнопка «ҚАЗ» в шапке переключает интерфейс на казахский. Документы (дневники, протоколы, выписки) формируются на русском — так ведётся медицинская документация.</p></div>
    <h2>Голосовой помощник</h2><div class="card">${aiSettingsHtml()}</div>
    <h2>Синхронизация</h2><div class="card" id="cloud"></div>
    <h2>Защита</h2><div class="card">${ACC.hasLock() ? '<p>PIN при открытии включён.</p><div class="actions"><button class="btn ghost sm" id="lkoff">Выключить PIN</button></div>' : `<p class="meta">Данные пациенток хранятся на телефоне — защитите приложение PIN-кодом.</p><div class="form">${tfield('lk', 'Новый PIN (4–8 цифр)', '', '', 'type="password" inputmode="numeric"')}</div><div class="actions"><button class="btn sm" id="lkon">Включить PIN</button></div>`}</div>
    <h2>Резервная копия</h2><div class="card"><p class="meta">Без синхронизации записи есть только на этом устройстве. Сохраняйте копию в файл.</p><div class="actions"><button class="btn ghost" id="bk1">Сохранить в файл</button><label class="btn ghost">Восстановить<input type="file" id="bk2" accept=".json,application/json" hidden></label></div><div id="bkm"></div></div>
    <h2>Доступ</h2><div class="card"><p>Код телефона: <b>${esc(ACC.dev())}</b></p>${ACC.admin() ? '<div class="actions"><a class="btn" href="#issue">Выдать доступ коллеге</a></div>' : ''}</div>
    <p class="foot">${CREDIT}, 2026. Версия ${VERSION}.</p>`, '#');
  $$('[data-t]').forEach((i) => i.addEventListener('input', () => { const x = team(); x[i.dataset.t] = i.value.trim(); PS.set('team', x); PS.set('teamT', Date.now()); DB.later(); }));
  const on = $('#lkon'); if (on) on.onclick = () => { const v = $('#lk').value.trim(); if (!/^\d{4,8}$/.test(v)) { toast('PIN — от 4 до 8 цифр'); return; } ACC.setLock(v); toast('PIN включён'); settingsPage(); };
  const off = $('#lkoff'); if (off) off.onclick = () => { ACC.clearLock(); settingsPage(); };
  $('#bk1').onclick = () => download(new Blob([JSON.stringify({ app: 'aig-pro', v: 1, saved: new Date().toISOString(), pts: DB.all(), team: team() })], { type: 'application/json' }), `aigdnevnik-${isoDate(today())}.json`);
  $('#bk2').onchange = (e) => { const fl = e.target.files[0]; if (!fl) return; fl.text().then((s) => { const j = JSON.parse(s); if (!Array.isArray(j.pts)) throw 0; const a = DB.all(); const ids = new Set(a.map((x) => x.id)); const add = j.pts.filter((x) => !ids.has(x.id)); PS.set('pts', a.concat(add)); if (j.team && !team().me) PS.set('team', j.team); $('#bkm').innerHTML = pill('Восстановлено пациенток: ' + add.length, 'ok'); DB.later(); }).catch(() => { $('#bkm').innerHTML = pill('Файл не подходит', 'bad'); }); };
  cloudBox(); bindAiSettings();
}
function cloudBox() {
  const el = $('#cloud'); if (!el) return;
  const msg = (t, c = 'bad') => { $('#cmsg').innerHTML = pill(esc(t), c); };
  if (SYNC.on()) {
    const at = SYNC.at();
    el.innerHTML = `<p>Включена · <b>${esc(SYNC.email())}</b></p><p class="meta">${at ? 'Последняя синхронизация: ' + ruDate(new Date(at)) + ' ' + ruTime(new Date(at)) : ''}</p><p class="meta">На компьютере или втором телефоне войдите с той же почтой и тем же паролем — пациентки появятся там.</p><div class="actions"><button class="btn sm" id="cnow">Синхронизировать</button><button class="btn ghost sm" id="coff">Выйти</button></div><div id="cmsg"></div>`;
    $('#cnow').onclick = () => SYNC.sync().then(() => { msg('Готово', 'ok'); }).catch((e) => msg(e.message));
    $('#coff').onclick = () => { if (confirm('Выключить синхронизацию на этом устройстве? Данные на телефоне останутся.')) { SYNC.off(); cloudBox(); } };
    return;
  }
  if (SYNC.signedIn()) {
    el.innerHTML = `<p>Почта подтверждена: <b>${esc(SYNC.email())}</b>. Придумайте пароль шифрования — им данные шифруются на устройстве. На другом устройстве введите тот же.</p><div class="form">${tfield('cpass', 'Пароль (не короче 6 символов)', '', '', 'type="password"')}</div><div class="actions"><button class="btn sm" id="cpok">Включить</button></div><div id="cmsg"></div>`;
    $('#cpok').onclick = () => SYNC.setPass($('#cpass').value).then(() => SYNC.sync()).then(() => cloudBox()).catch((e) => msg(/relation|does not exist|404/i.test(e.message) ? 'На сервере ещё нет таблицы vault_aig — её создаёт администратор (SQL ниже в инструкции).' : e.message));
    return;
  }
  el.innerHTML = `<p class="meta">Пациентки будут одинаковыми на телефоне и компьютере. Данные шифруются вашим паролем ещё на устройстве — сервер видит только шифр. Фамилии и ИИН всё равно не вводите.</p>
    <div class="form">${tfield('cmail', 'Почта', '', 'name@mail.kz', 'inputmode="email" autocomplete="email" autocapitalize="off"')}${tfield('ccode', 'Код из письма', '', '6 цифр', 'inputmode="numeric" autocomplete="one-time-code"')}</div>
    <div class="actions"><button class="btn sm" id="csend">Получить код</button><button class="btn ghost sm" id="cvfy">Войти</button></div><div id="cmsg"></div>
    ${ACC.admin() ? `<details style="margin-top:10px"><summary class="meta">Для администратора: таблица на сервере</summary><pre style="white-space:pre-wrap;font-size:.75rem;background:#fbf7f3;padding:8px;border-radius:8px">${esc(SYNC_SQL)}</pre></details>` : ''}`;
  $('#csend').onclick = () => { const m = $('#cmail').value.trim(); if (!/^\S+@\S+\.\S+$/.test(m)) return msg('Проверьте почту'); SYNC.sendCode(m).then(() => msg('Код отправлен. Проверьте и «Спам».', 'info')).catch((e) => msg(e.message)); };
  $('#cvfy').onclick = () => SYNC.verify($('#cmail').value, $('#ccode').value).then(() => cloudBox()).catch((e) => msg(/expired|invalid/i.test(e.message) ? 'Код неверный или устарел' : e.message));
}

/* ---------- маршрутизация ---------- */
function route() {
  if (!ACC.active()) return accessScreen(route);
  if (ACC.hasLock() && !ACC.opened()) return lockScreen(route);
  let h = location.hash.slice(1); try { h = decodeURIComponent(h); } catch (e) {}
  if (!h) return listPage();
  if (h === 'new') return newPage();
  if (h === 'settings') return settingsPage();
  if (h === 'issue') return issuePage();
  if (h === 'handover') return handoverPage();
  if (h === 'report') return reportPage();
  const m = /^p-([^/]+)(?:\/(.+))?$/.exec(h);
  if (m) {
    const p = DB.get(m[1]); if (!p) return listPage();
    const sub = m[2] || 'card';
    if (sub.startsWith('dy-')) return diaryPage(p, sub.slice(3));
    if (sub.startsWith('pe-')) return partoEntryPage(p, sub.slice(3));
    if (sub === 'print') return printPartoPage(p);
    if (sub === 'qr') return babyQrPage(p);
    return ptPage(p.id, sub);
  }
  listPage();
}
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && SYNC.on()) SYNC.sync().catch(() => {}); });
initLang('aig_pro_lang');
route();
if (SYNC.on()) SYNC.sync().catch(() => {});
registerSW();

</script>
